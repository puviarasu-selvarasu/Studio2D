[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studio2d"
version = "0.1.0"
description = "Local-first CPU-first anime production studio."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
py-modules = ["studio2d"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
